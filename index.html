<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Interface</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav>

        <div class="logo">
            NETFLIX
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#movies">TV Shows</a>
            <a href="#movies">Movies</a>
            <a href="#movies">My List</a>
        </div>

    </nav>


    <main>

        <!-- Hero Section -->
        <section class="hero">

            <div class="hero-content">

                <h1>Stranger Things</h1>

                <p>
                    When a young boy vanishes, a small town uncovers
                    a mystery involving secret experiments and strange forces.
                </p>

                <div class="hero-buttons">

                    <button class="play-btn">
                        ▶ Play
                    </button>

                    <button class="info-btn">
                        ⓘ More Info
                    </button>

                </div>

            </div>

        </section>


        <!-- Trending Movies -->
        <section class="movie-section" id="movies">

            <h2>Trending Now</h2>

            <div class="movie-grid">

                <article class="movie-card">

                    <img
                        src="https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg"
                        alt="Wednesday poster">

                    <h3>Wednesday</h3>

                </article>


                <article class="movie-card">

                    <img
                        src="https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg"
                        alt="Stranger Things poster">

                    <h3>Stranger Things</h3>

                </article>


                <article class="movie-card">

                    <img
                        src="https://image.tmdb.org/t/p/w500/cZ0d3rtvXPVvuiX22sP79K3Hmjz.jpg"
                        alt="The Witcher poster">

                    <h3>The Witcher</h3>

                </article>


                <article class="movie-card">

                    <img
                        src="https://image.tmdb.org/t/p/w500/reEMJA1uzscCbkpeRJeTT2bjqUp.jpg"
                        alt="Money Heist poster">

                    <h3>Money Heist</h3>

                </article>


                <article class="movie-card">

                    <img
                        src="https://image.tmdb.org/t/p/w500/apbrbWs8M9lyOpJYU5WXrpFbk1Z.jpg"
                        alt="Dark poster">

                    <h3>Dark</h3>

                </article>


                <article class="movie-card">

                    <img
                        src="https://image.tmdb.org/t/p/w500/ztkUQFLlC19CCMYHW9o1zWhJRNq.jpg"
                        alt="Breaking Bad poster">

                    <h3>Breaking Bad</h3>

                </article>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>© 2026 Netflix Interface Project</p>

    </footer>

</body>

</html>
